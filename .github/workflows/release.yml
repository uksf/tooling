name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-musl
            exe: ""
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Target
        run: rustup target add ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --release
      - name: Zig
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --user --break-system-packages ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build musl
        if: runner.os == 'Linux'
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}
      - name: Build msvc
        if: runner.os == 'Windows'
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          for bin in uksf-sign uksf-patcher; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.exe }}" "dist/${bin}-${{ matrix.platform }}${{ matrix.exe }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
